name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".pre-commit-config.yaml"
      - ".github/workflows/ci.yml"
      - "mkdocs.yml"
      - "docs/**"
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".pre-commit-config.yaml"
      - ".github/workflows/ci.yml"
      - "mkdocs.yml"
      - "docs/**"

permissions:
  contents: read

# Cancel any in-progress run for the same branch/PR when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run pre-commit
        if: hashFiles('.pre-commit-config.yaml') != ''
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Run mypy
        run: make typecheck

  # Validation only: builds the site into a throwaway directory and discards it.
  # Nothing is published here -- docs.yml is still the only workflow that
  # touches gh-pages, and it only runs on a release. The point is to catch
  # broken cross-references, dead anchors and missing nav entries on the PR
  # that introduces them rather than at release time.
  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install docs dependencies
        run: uv sync --locked --group docs

      - name: Build docs (strict)
        run: uv run mkdocs build --strict --site-dir "${RUNNER_TEMP}/site"

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        if: hashFiles('tests/**') != ''
        run: make test-fast

      - name: Upload coverage
        if: hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          disable_telem: true
          # Forks have no access to the token, so their pull requests do not fail on it.
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  test-slow:
    name: Slow tests (Python 3.12)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run slow tests
        if: hashFiles('tests/**') != ''
        run: make test-slow

  # One status check to require in branch protection. The path filters above
  # skip the whole workflow for some pull requests, and then this check does
  # not report at all.
  ci-ok:
    name: CI OK
    if: always()
    needs: [quality, docs, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
