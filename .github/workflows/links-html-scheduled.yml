name: Docs links (HTML, scheduled)

on:
  schedule:
    - cron: "20 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    name: Check published HTML links
    runs-on: ubuntu-latest
    steps:
      # Check out gh-pages into a directory named like the Pages base path
      # (/llm-annotator/), so that --root-dir resolves root-relative links such
      # as /llm-annotator/latest/...
      - uses: actions/checkout@v7.0.1
        with:
          ref: gh-pages
          path: llm-annotator
          persist-credentials: false

      - name: Restore lychee cache
        id: restore-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-html-${{ github.sha }}
          restore-keys: cache-lychee-html-

      - name: Check links with lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # A failed check opens an issue in the last step instead.
          fail: false
          token: ${{ secrets.GITHUB_TOKEN }}
          # .lychee.toml is not on the gh-pages branch, so it is not used here.
          # 404.html links to the unversioned site root, which does not exist
          # on gh-pages. overrides/ holds raw Jinja templates in sites that
          # were built before mkdocs.yml excluded them.
          args: >-
            --cache
            --no-progress
            --root-dir ${{ github.workspace }}
            --exclude-path '404\.html'
            --exclude-path 'overrides/'
            'llm-annotator/latest/**/*.html'

      - name: Save lychee cache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: .lycheecache
          key: ${{ steps.restore-cache.outputs.cache-primary-key || format('cache-lychee-html-{0}', github.sha) }}

      - name: Open issue with the report
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6.0.0
        with:
          title: Link checker report
          content-filepath: ./lychee/out.md
          labels: report, automated issue
