name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # hatch-vcs needs the full history and tags to compute the version.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.1

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test the wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import llm_annotator"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/llm-annotator/
    permissions:
      # Trusted publishing (OIDC) and PEP 740 attestations.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.3
