repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        # Needed to allow the mkdocs.yml config file to be linted by pre-commit
        args: [--unsafe]
      # Exlclude the prompts
      - id: end-of-file-fixer
        exclude: ^(examples|src)/.*\.md$
      - id: trailing-whitespace
        exclude: ^(examples|src)/.*\.md$

  - repo: local
    hooks:
      # mkdocstrings renders docstrings as Markdown, so Sphinx roles survive as
      # literal ":class:" text on the site. Use [`Name`][full.dotted.path].
      - id: no-rst-roles
        name: no Sphinx/RST roles in docstrings
        language: pygrep
        entry: ':(class|meth|func|mod|attr|obj|exc|data|ref):`'
        types: [python]
        files: ^(src|examples)/
      # Griffe only documents attributes that carry a real docstring, so "#:"
      # comments render as nothing at all. Put a """docstring""" underneath the
      # assignment instead.
      - id: no-sphinx-attribute-comments
        name: no Sphinx "#:" attribute comments
        language: pygrep
        entry: '^\s*#:'
        types: [python]
        files: ^src/
      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check --fix --exit-non-zero-on-fix --
        language: system
        types: [python]
        pass_filenames: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --
        language: system
        types: [python]
        pass_filenames: true
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
