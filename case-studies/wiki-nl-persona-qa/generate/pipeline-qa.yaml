# Persona-grounded Dutch Wikipedia QA, generated with Qwen/Qwen3.6-35B-A3B-FP8.
#
# Two steps on one model, so they share a config: the second reads the
# `question` column the first wrote. Neither step has an `output_schema` --
# both the question and the answer are free text -- so `write-question`
# renames its `write-question_response` straight to `question` and there is
# nothing for `filter_invalid` to check against; empty questions and answers
# are instead caught downstream by ../filter_rows.py. Step 1 runs with
# thinking off (even the longest question is a few sentences and does not
# need a reasoning budget); step 2 runs with thinking on, because its trace is
# the reasoning half of the training data.
#
# Step 2 is served with `--reasoning-parser qwen3`, so vLLM hands the trace
# back separately and the annotator writes it to `answer-question_reasoning`,
# leaving `answer-question_response` as the answer alone.

output_dir: ../outputs/generate

verbose: true
log_level: INFO

dataset:
  path: ../outputs/seed

client:
  provider: vllm_online
  model: Qwen/Qwen3.6-35B-A3B-FP8
  batch_size: 16
  queue_size: 8
  options:
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    max_completion_tokens: 8192
    chat_template_kwargs:
      enable_thinking: false
  engine:
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.95
    max_model_len: 12288
    max_num_seqs: 256
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    speculative_config:
      method: qwen3_next_mtp
      num_speculative_tokens: 2

steps:
  - name: write-question
    prompt_file: prompts/write_question.md
    sort_by_length: longest_first
    rename:
      write-question_response: question

  - name: answer-question
    prompt_file: prompts/answer_question.md
    sort_by_length: longest_first
    client:
      options:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        max_completion_tokens: 16000
        chat_template_kwargs:
          enable_thinking: true
      engine:
        tensor_parallel_size: 2
        gpu_memory_utilization: 0.95
        max_model_len: 20000
        max_num_seqs: 256
        max_num_batched_tokens: 8192
        enable_prefix_caching: true
        reasoning_parser: qwen3
        speculative_config:
          method: qwen3_next_mtp
          num_speculative_tokens: 2
