[project]
name = "llm-annotator"
dynamic = ["version"]
description = "An easy-to-extend LLM annotator for robust, resumable data annotation."
readme = "README.md"
authors = [
    { name = "Bram Vanroy", email = "2779410+BramVanroy@users.noreply.github.com" }
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: MkDocs",
  "Framework :: Pytest",
  "Typing :: Typed",
]

requires-python = ">=3.12,<3.14"
dependencies = [
    "colorama>=0.4.6,<1",
    "datasets>=5,<6",
    "pydantic>=2.13.4,<3",
]

[project.optional-dependencies]
# Install with ---extras "vllm" to use vLLM for inference. Requires CUDA.
vllm = [
    "vllm==0.27.1",
    # vLLM only requires transformers>=5.5.3, but 5.8.x has issues with gemma4
    "transformers>=5.11.0",
]
# Prebuilt FlashInfer kernels, to be installed next to the "vllm" extra on
# machines that actually serve models:
#   uv sync --extra vllm --extra vllm-kernels
# Without them vLLM JIT-compiles those kernels the first time it serves a
# model, which needs nvcc (gone after `module purge` on a cluster) and lets
# several servers sharing one home directory race each other in
# ~/.cache/flashinfer until one dies loading a half-written .so. They are kept
# out of the "vllm" extra because together they weigh ~2.5 GB, which the dev
# group and CI have no use for. Both versions must match the flashinfer-python
# that vllm pins; see https://docs.flashinfer.ai/installation.html
vllm-kernels = [
    "flashinfer-cubin==0.6.16.post3",
    "flashinfer-jit-cache==0.6.16.post3",
]
anthropic = [
    "anthropic>=0.102.0,<1",
]
openai = [
    "openai>=2.36.0,<3",
]

[dependency-groups]
docs = [
    "mkdocs-material>=9.7.6,<10",
    "mike>=2.1.3,<3",
    "mkdocstrings[python]>=1.0.4,<2",
    "mkdocs-autorefs>=1.4.4,<2",
    "mkdocs-gen-files>=0.6.1,<1",
    "mkdocs-minify-plugin>=0.8.0,<1",
]

dev = [
    "llm_annotator[vllm,anthropic,openai]",
    {include-group = "docs"},
    "interrogate>=1.7.0,<2",
    "mypy>=1.20.1,<2",
    "pre-commit>=4.6.0,<5",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10,<1",
    "types-colorama>=0.4.15.20240311,<1",
]

[project.urls]
Homepage = "https://github.com/BramVanroy/llm-annotator"
Documentation = "https://BramVanroy.github.io/llm-annotator"
Repository = "https://github.com/BramVanroy/llm-annotator"
Issues = "https://github.com/BramVanroy/llm-annotator/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# FlashInfer's prebuilt kernels are not on PyPI: the cubins live on its own
# index and the JIT cache is published per CUDA release. Pick the variant that
# matches the *torch build* (vllm 0.27.1 pulls torch 2.13.0+cu130, so cu130),
# not the CUDA toolkit module a cluster happens to offer: these kernels link
# against the CUDA runtime shipped inside the torch/nvidia wheels, and the only
# thing the node needs is a driver new enough for that runtime. Both indexes
# are `explicit`, so only the packages mapped to them below are fetched there.
[[tool.uv.index]]
name = "flashinfer-cubin"
url = "https://flashinfer.ai/whl/"
explicit = true

[[tool.uv.index]]
name = "flashinfer-jit-cache"
url = "https://flashinfer.ai/whl/cu130/"
explicit = true

[tool.uv.sources]
flashinfer-cubin = { index = "flashinfer-cubin" }
flashinfer-jit-cache = { index = "flashinfer-jit-cache" }

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_annotator"]

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.lint]
ignore = ["C901", "E501", "E741", "F402", "F823", "E402"]
select = ["C", "E", "F", "W", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["llm_annotator"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.interrogate]
style = "google"
exclude = ["tests", "scratches", "examples", "docs"]
ignore-private = true
ignore-semiprivate = true
ignore-nested-functions = true
ignore-module = true
color = true

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["torch.*", "vllm.*", "datasets.*", "tqdm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=llm_annotator",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-v",
    "--doctest-modules",
    "--import-mode=importlib",
    "--cov=llm_annotator",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (may require model loading or longer runtime)",
    "integration: marks tests that interact with external systems (Hugging Face Hub, network, or real-model runtimes). These tests require an authenticated Hugging Face account (for example via `hf auth login` or a `HUGGINGFACE_HUB_TOKEN`/`HF_TOKEN` in CI) and may perform uploads/deletions; tests attempt to clean up after themselves.",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
