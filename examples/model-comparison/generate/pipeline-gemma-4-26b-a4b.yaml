# Generate grounded Dutch Wikipedia QA pairs with google/gemma-4-26B-A4B-it.

output_dir: ../outputs/generate/gemma-4-26b-a4b

verbose: true
log_level: INFO

dataset:
  path: ../outputs/seed

client:
  provider: vllm_online
  model: google/gemma-4-26B-A4B-it
  batch_size: 16
  queue_size: 8
  wait_for_servers: 1800
  options:
    temperature: 0.8
    top_p: 0.95
    max_completion_tokens: 512
  # 2 GPUs requested (tensor_parallel_size) because the model is too large for 1
  engine:
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.90
    max_num_seqs: 256
    max_num_batched_tokens: 8192
    speculative_config:
      model: google/gemma-4-26B-A4B-it-assistant
      num_speculative_tokens: 4
  pool:
    servers: 1

steps:
  - name: generate-qa
    system_prompt_file: prompts/system.md
    prompt_file: prompts/generate_qa.md
    output_schema_file: schemas/qa.json
    sort_by_length: longest_first
    num_retries_invalid: 3
