# A two-step pipeline: one model writes a question-answer pair about a text,
# a second model rates the pair it produced.
#
# Run it with either of:
#   uv run llm-annotate examples/pipeline-qa/config.yaml
#   uv run python scripts/annotate.py examples/pipeline-qa/config.yaml
#
# Every path below is relative to this file, so the directory can be copied
# elsewhere and still work.

output_dir: outputs/pipeline-qa

# Uncomment to push the final dataset (and only the final dataset) to the Hub.
# hub_id: your-username/wiki-qa-rated

verbose: true
log_level: INFO

# Input for the first step. Swap `name`/`split` for your own dataset, or use
# `path:` to read one written with `save_to_disk`.
dataset:
  name: stanfordnlp/imdb
  split: test
  max_num_samples: 20

# Defaults for every step. A step's own `client` block is merged over this, so
# a step that only changes the model does not have to repeat the rest.
client:
  provider: vllm_offline
  model: HuggingFaceTB/SmolLM2-135M-Instruct
  batch_size: 16
  init:
    max_model_len: 4096
  options:
    temperature: 0.7
    max_tokens: 512

steps:
  # Step 1 turns each review into a question-answer pair. The schema's
  # properties (`question`, `answer`) become dataset columns, and `rename`
  # tags them as this step's version so a later step could add its own.
  - name: write-qa
    prompt_file: prompts/write_qa.md
    system_prompt_file: prompts/system.md
    output_schema_file: schemas/qa.json
    sort_by_length: true
    num_retries_invalid: 3
    filter_invalid: true
    rename:
      question: question_v1
      answer: answer_v1

  # Step 2 rates the pair from step 1. Its prompt reads the renamed columns,
  # which is the whole point of running the steps in sequence.
  - name: rate-qa
    prompt_file: prompts/rate_qa.md
    output_schema_file: schemas/rating.json
    num_retries_invalid: 3
    # A different provider for the judge, so the rater is not the writer.
    # Remove this block to reuse the model above (which is also faster,
    # because the model is then loaded only once for the whole pipeline).
    client:
      provider: vllm_offline
      model: HuggingFaceTB/SmolLM2-360M-Instruct
      options:
        temperature: 0.0
        max_tokens: 256
