# A two-step pipeline that mixes a locally served model with a hosted one:
# a pool of vLLM servers writes a question-answer pair about each text, then
# Claude rates the pair that was written.
#
# On a cluster, submit it with one job chain per step:
#
#   ANNOTATE_CONFIG=examples/vllm-server-pool/pipeline.yaml \
#     ./slurm/submit_pipeline.sh
#
# submit_pipeline.sh asks this file what each step needs
# (`llm-annotate <config> --describe-steps`), starts a GPU server array for
# step 1 and a CPU-only job for step 2, and passes each step's own servers in
# with --hosts-file. Nothing about the allocation is repeated here or there.
#
# The same file runs end to end on one machine, with no SLURM involved:
#
#   llm-annotate examples/vllm-server-pool/pipeline.yaml
#
# in which case step 1 talks to a vLLM server on localhost:8000.

output_dir: outputs/vllm-server-pool

verbose: true
log_level: INFO

dataset:
  name: stanfordnlp/imdb
  split: test
  max_num_samples: 200

steps:
  # `model` is named exactly once, in this step's `client` block below. The
  # servers and the client both read it from there -- a job submitter passes it
  # to `vllm serve`, the client sends it with every request -- so the two can
  # never disagree.
  #
  # Dropping `model` is only an option when the servers already exist: a
  # `vllm_online` client with no model asks the server which one it is serving.
  # A submitter that has to *start* the servers has nothing to ask, so
  # slurm/submit_pipeline.sh refuses such a step before allocating any GPU.
  - name: write-qa
    prompt: |
      Read the following text and write one question that it answers, together
      with the answer. Both must be answerable from the text alone.

      Text:
      {text}
    output_schema:
      type: object
      required: [question, answer]
      properties:
        question: {type: string}
        answer: {type: string}
    sort_by_length: true
    num_retries_invalid: 3
    filter_invalid: true
    rename:
      question: question_v1
      answer: answer_v1
    client:
      provider: vllm_online
      model: Qwen/Qwen3-8B
      batch_size: 64
      queue_size: 8
      options:
        max_tokens: 512
        temperature: 0.7
      # How many servers to start for this step, and how big each one is.
      # Only read by a job submitter; ignored when you run this locally.
      pool:
        servers: 4
        gpus_per_vllm_server: 2

  # A hosted judge. This step needs no GPU at all, so on a cluster it becomes a
  # CPU-only job and the GPUs from step 1 are released before it starts.
  - name: rate-qa
    prompt: |
      Rate the question-answer pair below from 1 (unusable) to 5 (excellent)
      and justify the rating in one sentence.

      Text:
      {text}

      Question: {question_v1}
      Answer: {answer_v1}
    output_schema:
      type: object
      required: [rating, rationale]
      properties:
        rating: {type: integer, minimum: 1, maximum: 5}
        rationale: {type: string}
    num_retries_invalid: 3
    client:
      provider: claude
      model: claude-haiku-4-5
      options:
        max_tokens: 256
