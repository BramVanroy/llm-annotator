# Generate grounded Dutch Wikipedia QA pairs with ibm-granite/granite-4.1-3b-fp8.
#
# One of three single-model, single-step "generate" pipelines that write to
# their own output_dir -- see ../README.md for why they are not one pipeline,
# and for the exact submission command (the serving flags below must be set
# per model, which today only works when each model gets its own submission).
#
# Seed first (shared across all three generate pipelines):
#
#   uv run examples/gpt-nl-e/model-comparison/prepare_seed.py \
#     --num-samples 200 \
#     --out examples/gpt-nl-e/model-comparison/outputs/seed

output_dir: outputs/gpt-nl-e/model-comparison/generate/granite-4.1-3b

verbose: true
log_level: INFO

dataset:
  path: outputs/gpt-nl-e/model-comparison/seed

client:
  provider: vllm_online
  model: ibm-granite/granite-4.1-3b-fp8
  batch_size: 16
  queue_size: 8
  wait_for_servers: 1800
  options:
    temperature: 0.8
    top_p: 0.95
    max_tokens: 512
  pool:
    servers: 1
    gpus_per_vllm_server: 1

steps:
  - name: generate-qa
    system_prompt_file: prompts/system.md
    prompt_file: prompts/generate_qa.md
    output_schema_file: schemas/qa.json
    sort_by_length: longest_first
    num_retries_invalid: 3
